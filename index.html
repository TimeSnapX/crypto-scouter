<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crypto Market Scouter</title>
<meta name="description" content="Live Solana trench coin scouter: Heat and Risk scores, of-worth alerts. Research only, not financial advice.">
<meta name="theme-color" content="#050714">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script src="js/install.js?v=1"></script>
</head><body>
<div class="bg"></div>
<header class="glass"><div class="brand"><span class="logo">◎</span><div><h1>CRYPTO MARKET SCOUTER</h1><small id="status">Booting radar…</small></div></div>
 <div class="hr"><span class="nfa">RESEARCH ONLY · NOT FINANCIAL ADVICE</span><button class="btn small install-btn" type="button">📲 Install app</button><button class="btn small" id="refresh" title="Refresh now">⟳ <span id="count">…</span></button></div></header>
<div id="install-hint" class="glass hidden" role="status"><span class="ih-text"></span><button class="ih-close btn small" type="button" aria-label="Close">✕</button></div>
<nav class="glass"><button data-tab="radar" class="on">Radar</button><button data-tab="watch">Watchlist</button><button data-tab="alerts">Alerts <span id="worthN" class="badge"></span></button><button data-tab="analytics">Analytics</button><button data-tab="argus">Argus</button><button data-tab="hades">Hades</button></nav>
<section id="filters" class="glass">
 <input id="f-q" type="search" placeholder="Search symbol, name or CA">
 <label>Heat ≥ <input id="f-minHeat" type="number" min="0" max="100"></label>
 <label>Risk ≤ <input id="f-maxRisk" type="number" min="0" max="100"></label>
 <label>Liq ≥ $<input id="f-minLiq" type="number" min="0" step="1000"></label>
 <label>Age ≤ h <input id="f-maxAgeH" type="number" min="0" title="0 = any"></label>
 <label><input id="f-worthOnly" type="checkbox"> Of worth only</label>
 <label>Sort <select id="f-sort"><option value="heat">Heat</option><option value="risk">Lowest risk</option><option value="age">Newest</option><option value="liq">Liquidity</option><option value="vol">Volume 1h</option></select></label>
</section>
<main id="main"></main>
<aside id="drawer" class="glass"><button class="btn small" id="closeDrawer">✕ Close</button><div id="drawerBody"></div></aside>
<dialog id="modal"></dialog>
<div id="toasts"></div>
<footer>Data: DexScreener, GeckoTerminal, RugCheck (keyless, live from your browser). Missing fields read “unknown”. <b>Research only, not financial advice.</b> · <a href="https://github.com/TimeSnapX/crypto-scouter/blob/main/FORMULA.md" target="_blank" rel="noopener">How scores work</a></footer>
<script type="module" src="src/app.js"></script>
</body></html>
